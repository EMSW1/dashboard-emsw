<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMSW Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Light Mode Defaults */
        body {
            background-color: #f1f5f9; /* slate-100 */
            color: #0f172a; /* slate-900 */
        }

        /* Dark Mode Overrides */
        .dark body {
            background-color: #020617;
            color: #f8fafc;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        
        /* Glassmorphism utilities */
        .glass-card {
            transition: background 0.3s ease, border-color 0.3s ease;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            
            /* Light Mode Glass */
            background: rgba(255, 255, 255, 0.70);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .dark .glass-card {
            /* Dark Mode Glass */
            background: rgba(15, 23, 42, 0.70);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        /* Cosmic Background Animation */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .animate-bg {
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Loader */
        .loader {
            border: 4px solid rgba(59, 130, 246, 0.1);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Accordion transition */
        .accordion-content {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 2000px; /* Arbitrary large height */
            opacity: 1;
        }
        .rotate-180 { transform: rotate(180deg); }

        /* Stars styling based on mode */
        .star-dot {
            background-color: #94a3b8; /* Slate-400 for light mode */
        }
        .dark .star-dot {
            background-color: #ffffff;
        }
    </style>
  <script type="importmap">
{
  "imports": {
    "firebase/": "https://esm.sh/firebase@^12.8.0/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body class="min-h-screen relative p-4 md:p-8">

    <!-- Cosmic Background: Light gradient vs Dark gradient -->
    <div class="fixed inset-0 -z-10 bg-gradient-to-br from-blue-50 via-slate-100 to-white dark:from-slate-900 dark:via-[#0f172a] dark:to-black animate-bg transition-colors duration-500"></div>
    <div class="fixed inset-0 -z-10 opacity-60 pointer-events-none" id="stars-container">
        <!-- Stars will be injected here via JS -->
    </div>

    <!-- Main App Container -->
    <div id="app" class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-10 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
              <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-purple-600 italic tracking-tighter drop-shadow-sm">
                EMSW <span class="text-slate-800 dark:text-white transition-colors">DASHBOARD</span>
              </h1>
              <p class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mt-1">
                ALL STATS
              </p>
            </div>
            <div class="flex items-center gap-2">
                <!-- Theme Toggle Button -->
                <button id="theme-toggle" class="glass-card w-10 h-10 flex items-center justify-center rounded-xl hover:bg-black/5 dark:hover:bg-white/10 transition-all active:scale-95 text-xl">
                    <span id="icon-sun" class="hidden">☀️</span>
                    <span id="icon-moon" class="hidden">🌙</span>
                </button>
                
                <button id="refresh-btn" class="glass-card px-6 py-2 rounded-xl text-xs font-bold uppercase tracking-wider hover:bg-black/5 dark:hover:bg-white/10 transition-all active:scale-95 text-slate-700 dark:text-white">
                    ↻ Refresh
                </button>
            </div>
        </header>

        <!-- Global Stats Section -->
        <section class="mb-12 animate-fade-in">
            <h2 class="text-sm font-black text-slate-500 uppercase tracking-widest mb-4 pl-2">Global Performance</h2>
            <!-- Updated Grid to fit more stats -->
            <div id="global-stats-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                <!-- Global stats injected here -->
                <div class="col-span-full flex justify-center py-8"><div class="loader"></div></div>
            </div>
        </section>

        <!-- Entity List Section -->
        <section class="pb-20">
            <h2 class="text-sm font-black text-slate-500 uppercase tracking-widest mb-4 pl-2">Entity Details</h2>
            <div id="entities-list" class="space-y-4">
                <!-- Entities injected here -->
            </div>
        </section>

        <footer class="text-center text-[10px] font-bold text-slate-500 dark:text-slate-600 uppercase pb-4">
            Laste update :  <span id="last-updated"></span>
        </footer>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
        import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js';

        // --- Theme Logic ---
        const htmlEl = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');
        const iconSun = document.getElementById('icon-sun');
        const iconMoon = document.getElementById('icon-moon');

        function updateThemeIcons() {
            if (htmlEl.classList.contains('dark')) {
                iconSun.classList.remove('hidden');
                iconMoon.classList.add('hidden');
            } else {
                iconSun.classList.add('hidden');
                iconMoon.classList.remove('hidden');
            }
        }

        // Initialize Theme
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlEl.classList.add('dark');
        } else {
            htmlEl.classList.remove('dark');
        }
        updateThemeIcons();

        // Toggle Theme
        themeBtn.addEventListener('click', () => {
            htmlEl.classList.toggle('dark');
            if (htmlEl.classList.contains('dark')) {
                localStorage.theme = 'dark';
            } else {
                localStorage.theme = 'light';
            }
            updateThemeIcons();
        });


        // --- Configuration ---
        const ENTITY_CONFIGS = {
          EMS1: {
            apiKey: "AIzaSyCEwB2iTsirdhL6O3xymPGAt2k5yia6tjw",
            authDomain: "ems1-reporting.firebaseapp.com",
            databaseURL: "https://ems1-reporting-default-rtdb.firebaseio.com",
            projectId: "ems1-reporting",
            storageBucket: "ems1-reporting.firebasestorage.app",
            messagingSenderId: "649094135962",
            appId: "1:649094135962:web:eaa6641f80c2805e8f5f23",
            measurementId: "G-G8JF9QJ6QR"
          },
          EMS3: {
            apiKey: "AIzaSyBp5t2-Xlxj6_XiDi6y09zbOkHYLe2X9Ls",
            authDomain: "ems3-reporting.firebaseapp.com",
            databaseURL: "https://ems3-reporting-default-rtdb.firebaseio.com",
            projectId: "ems3-reporting",
            storageBucket: "ems3-reporting.firebasestorage.app",
            messagingSenderId: "696098202646",
            appId: "1:696098202646:web:8abbc6257a2982549c0137",
            measurementId: "G-BWJNRYQK6T"
          },
          EMS4: {
            apiKey: "AIzaSyAFR96bibEGLaMroqFZCLcSHyCoAdewz78",
            authDomain: "ems4-reporting.firebaseapp.com",
            databaseURL: "https://ems4-reporting-default-rtdb.firebaseio.com",
            projectId: "ems4-reporting",
            storageBucket: "ems4-reporting.firebasestorage.app",
            messagingSenderId: "290747078412",
            appId: "1:290747078412:web:f1ddc2273dc07cc6e55b29",
            measurementId: "G-PTFJKHYZ1R"
          },
          EMS6: {
            apiKey: "AIzaSyB_aylTk3hW60y3Kewlbb4B76J3f-lx0qE",
            authDomain: "ems6-reporting.firebaseapp.com",
            databaseURL: "https://ems6-reporting-default-rtdb.firebaseio.com",
            projectId: "ems6-reporting",
            storageBucket: "ems6-reporting.firebasestorage.app",
            messagingSenderId: "1091962206156",
            appId: "1:1091962206156:web:0c6c970e222403ab1f8f69",
            measurementId: "G-JFCVVTHMNR"
          },
          DMF: {
            apiKey: "AIzaSyBaPXh-EtZqg-cgD_RNyEx_PNisfngT8-s",
            authDomain: "dmf-reporting.firebaseapp.com",
            databaseURL: "https://dmf-reporting-default-rtdb.firebaseio.com/",
            projectId: "dmf-reporting",
            storageBucket: "dmf-reporting.firebasestorage.app",
            messagingSenderId: "151591156744",
            appId: "1:151591156744:web:ec1a8c2a68b629c46ca5bd",
            measurementId: "G-SXD0J4SVK4"
          }
        };

        // --- State ---
        const state = {
            entities: [],
            loading: true,
            expandedEntities: new Set()
        };

        // --- Improved Metric Extraction Helper ---
        function findMetric(obj, keys, type = 'int') {
            if (!obj) return type === 'string' ? '-' : 0;
            
            const objKeys = Object.keys(obj);
            const objKeysLower = objKeys.map(k => k.toLowerCase().trim());
            
            for (const key of keys) {
                const searchKey = key.toLowerCase().trim();
                const idx = objKeysLower.indexOf(searchKey);
                
                if (idx !== -1) {
                    const val = obj[objKeys[idx]];
                    if (val !== undefined && val !== null && val !== '') {
                        if (type === 'int') {
                            const p = parseInt(val, 10);
                            return isNaN(p) ? 0 : p;
                        }
                        return val;
                    }
                }
            }
            return type === 'string' ? '-' : 0;
        }

        // --- Firebase Service ---
        const initializedApps = {};

        function getEntityApp(entityId) {
            if (initializedApps[entityId]) return initializedApps[entityId];
            const existingApps = getApps();
            const found = existingApps.find(app => app.name === entityId);
            if (found) {
                initializedApps[entityId] = found;
            } else {
                initializedApps[entityId] = initializeApp(ENTITY_CONFIGS[entityId], entityId);
            }
            return initializedApps[entityId];
        }

        async function fetchEntityData(entityId) {
            try {
                const app = getEntityApp(entityId);
                const db = getDatabase(app);
                const rootPath = entityId.toLowerCase();

                const [globalSnap, plansSnap] = await Promise.all([
                    get(ref(db, `${rootPath}/global_stats`)),
                    get(ref(db, `${rootPath}/plans`))
                ]);

                // 1. Extract Global Stats
                const globalRaw = globalSnap.exists() ? globalSnap.val() : {};
                const globalStats = {
                    rdps: findMetric(globalRaw, ['rdps', 'RDPs', 'RDP'], 'int'),
                    seeds: findMetric(globalRaw, ['seeds', 'Seeds', 'SEEDS'], 'int'),
                    qual: findMetric(globalRaw, ['qual', 'quality', 'QUALITY', 'Quality'], 'int'),
                    pause: findMetric(globalRaw, ['pause', 'paused', 'PAUSED', 'Paused'], 'int'),
                    proxy: findMetric(globalRaw, ['proxy', 'Proxy', 'PROXY'], 'int')
                };

                // 2. Extract Platform Details
                const plansRaw = plansSnap.exists() ? plansSnap.val() : {};
                const platforms = {};

                Object.keys(plansRaw).forEach(key => {
                    if (key === 'SELENIUM_BRAVE' || key === 'SELENIUM_CHROME') return;

                    const planData = plansRaw[key] || {};
                    const currentData = planData.current || {};
                    
                    const searchObj = { 
                        ...(planData.stats || {}),
                        ...currentData, 
                        ...(currentData.stats || {}) 
                    };

                    if (Object.keys(searchObj).length > 0 || planData.deploys) {
                        
                        let calculatedRotation = '-';
                        const rotMin = searchObj.rotMin || searchObj.rotmin || searchObj.RotMin;
                        const rotMax = searchObj.rotMax || searchObj.rotmax || searchObj.RotMax;
                        if (rotMin !== undefined && rotMax !== undefined) {
                            calculatedRotation = `${rotMin}-${rotMax}`;
                        }
                        let finalRotation = calculatedRotation !== '-' ? calculatedRotation : findMetric(searchObj, ['Rotation', 'rotation', 'Rotation (min-max)', 'Rotations'], 'string');

                        let activeDeploysCount = 0;
                        if (planData.deploys && typeof planData.deploys === 'object') {
                            activeDeploysCount = Object.keys(planData.deploys).length;
                        } else {
                            activeDeploysCount = findMetric(searchObj, [
                                'nbrdeploysperhour', 'nbr_deploys_per_hour',
                                'active_deploys', 'nbr_active_deploys', 'activeDeploys',
                                'Deploys/h'
                            ]);
                        }

                        const stats = {
                             seeds: findMetric(searchObj, ['Seeds', 'seeds', 'SEEDS']),
                             rdps: findMetric(searchObj, ['RDPs', 'rdps', 'RDP']),
                             sessions: findMetric(searchObj, ['Sessions', 'sessions']),
                             deploysHr: activeDeploysCount,
                             deploysDay: findMetric(searchObj, [
                                'nbrseploysperday', 'nbrdeploysperday', 'nbr_deploys_per_day',
                                'Deploys/d', 'Deploys/Day', 'daily_deploys'
                             ]),
                             seedsHr: findMetric(searchObj, [
                                'nbrseedsperhour', 'nbr_seeds_per_hour',
                                'Seeds/h', 'Seeds/Hour'
                             ]),
                             seedsDay: findMetric(searchObj, [
                                'nbrseedsperday', 'nbr_seeds_per_day',
                                'Seeds/d', 'Seeds/Day'
                             ]),
                             lancements: findMetric(searchObj, [
                                'nbrlancement', 'nbr_lancement',
                                'Lancements', 'Launches'
                             ]),
                             quality: findMetric(searchObj, ['Quality', 'quality', 'Qual', 'qual']),
                             paused: findMetric(searchObj, ['Paused', 'paused', 'Pause', 'pause']),
                             qualityPeriod: findMetric(searchObj, ['period', 'Period', 'Periode', 'période'], 'string'),
                             rotation: finalRotation
                        };
                        
                        platforms[key] = {
                            stats: stats,
                            updatedAt: currentData.updatedAt || planData.updatedAt || ''
                        };
                    }
                });

                return {
                    id: entityId,
                    globalStats: globalStats,
                    platforms: platforms,
                    error: null
                };
            } catch (error) {
                console.error(`Failed to load ${entityId}`, error);
                return {
                    id: entityId,
                    globalStats: { rdps: 0, seeds: 0, qual: 0, pause: 0, proxy: 0 },
                    platforms: {},
                    error: error.message
                };
            }
        }

        // --- UI Rendering Helpers ---

        function renderStatCard(label, value, colorClass, icon) {
            return `
                <div class="glass-card p-4 rounded-2xl flex flex-col items-center justify-center hover:bg-black/5 dark:hover:bg-white/5 transition-colors group">
                    <div class="text-xs font-black uppercase tracking-wider mb-1 ${colorClass} opacity-80 group-hover:opacity-100 whitespace-nowrap">
                        <span class="mr-1">${icon}</span> ${label}
                    </div>
                    <div class="text-3xl font-black ${colorClass} drop-shadow-md">
                        ${value || 0}
                    </div>
                </div>
            `;
        }

        function renderEntityRow(entity) {
            const isExpanded = state.expandedEntities.has(entity.id);
            
            const allPlatforms = Object.entries(entity.platforms);
            const activePlatforms = allPlatforms.filter(([_, data]) => data.stats.seeds > 0);
            
            const activeCount = activePlatforms.length;
            const shortName = entity.id.replace('EMS', 'E').replace('DMF', 'D');

            let platformsHTML = '';
            if (activePlatforms.length === 0) {
                 if (allPlatforms.length === 0) {
                     platformsHTML = `<div class="col-span-full text-center py-4 text-slate-500 text-xs italic">No active platforms found or permission denied.</div>`;
                 } else {
                     platformsHTML = `<div class="col-span-full text-center py-4 text-slate-500 text-xs italic">No platforms with active seeds.</div>`;
                 }
            } else {
                activePlatforms.forEach(([platName, data]) => {
                    const time = data.updatedAt ? (data.updatedAt.split(' ')[1] || data.updatedAt) : '';
                    platformsHTML += `
                        <div class="bg-slate-200/50 dark:bg-slate-800/40 rounded-xl p-4 border border-black/5 dark:border-white/5 hover:border-black/10 dark:hover:border-white/10 transition-colors flex flex-col h-full">
                            <div class="flex justify-between items-start mb-4">
                                <h4 class="font-black text-sm text-indigo-500 dark:text-indigo-300 uppercase truncate pr-2" title="${platName}">${platName}</h4>
                                ${time ? `<span class="text-[9px] text-slate-500 bg-white/50 dark:bg-slate-900/50 px-2 py-0.5 rounded whitespace-nowrap">${time}</span>` : ''}
                            </div>
                            
                            <div class="mt-auto">
                                <div class="text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-2 pb-1 border-b border-black/5 dark:border-white/5">Performance Stats</div>
                                <div class="grid grid-cols-2 md:grid-cols-3 gap-2 text-xs">
                                    
                                    <!-- Seeds -->
                                    <div class="flex flex-col bg-slate-300/50 dark:bg-slate-900/30 p-2 rounded items-center justify-center">
                                        <span class="text-slate-500 font-bold text-[9px] uppercase">Seeds</span>
                                        <span class="font-mono font-bold text-emerald-600 dark:text-emerald-400 text-sm">${data.stats.seeds}</span>
                                    </div>
                                    <!-- RDPs -->
                                    <div class="flex flex-col bg-slate-300/50 dark:bg-slate-900/30 p-2 rounded items-center justify-center">
                                        <span class="text-slate-500 font-bold text-[9px] uppercase">RDPs</span>
                                        <span class="font-mono font-bold text-blue-600 dark:text-blue-400 text-sm">${data.stats.rdps}</span>
                                    </div>
                                    <!-- Sessions -->
                                    <div class="flex flex-col bg-slate-300/50 dark:bg-slate-900/30 p-2 rounded items-center justify-center">
                                        <span class="text-slate-500 font-bold text-[9px] uppercase">Sessions</span>
                                        <span class="font-mono font-bold text-slate-700 dark:text-white text-sm">${data.stats.sessions}</span>
                                    </div>
                                    
                                    <!-- Deploys/day -->
                                    <div class="flex flex-col bg-slate-300/50 dark:bg-slate-900/30 p-2 rounded items-center justify-center">
                                        <span class="text-slate-500 font-bold text-[9px] uppercase">Deploys/day</span>
                                        <span class="font-mono font-bold text-indigo-600 dark:text-indigo-400 text-sm">${data.stats.deploysDay}</span>
                                    </div>
                                    
                                    <!-- Seeds/h -->
                                    <div class="flex flex-col bg-slate-300/50 dark:bg-slate-900/30 p-2 rounded items-center justify-center">
                                        <span class="text-slate-500 font-bold text-[9px] uppercase">Seeds/h</span>
                                        <span class="font-mono font-bold text-teal-600 dark:text-teal-400 text-sm">${data.stats.seedsHr}</span>
                                    </div>
                                    <!-- Seeds/day -->
                                    <div class="flex flex-col bg-slate-300/50 dark:bg-slate-900/30 p-2 rounded items-center justify-center">
                                        <span class="text-slate-500 font-bold text-[9px] uppercase">Seeds/day</span>
                                        <span class="font-mono font-bold text-teal-600 dark:text-teal-400 text-sm">${data.stats.seedsDay}</span>
                                    </div>
                                    <!-- Lancements -->
                                    <div class="flex flex-col bg-slate-300/50 dark:bg-slate-900/30 p-2 rounded items-center justify-center">
                                        <span class="text-slate-500 font-bold text-[9px] uppercase">Lancements</span>
                                        <span class="font-mono font-bold text-slate-700 dark:text-white text-sm">${data.stats.lancements}</span>
                                    </div>
                                    
                                    <!-- Qualité -->
                                    <div class="flex flex-col bg-slate-300/50 dark:bg-slate-900/30 p-2 rounded items-center justify-center">
                                        <span class="text-slate-500 font-bold text-[9px] uppercase">Quality</span>
                                        <span class="font-mono font-bold text-purple-600 dark:text-purple-400 text-sm">${data.stats.quality}</span>
                                    </div>
                                    <!-- Paused -->
                                    <div class="flex flex-col bg-slate-300/50 dark:bg-slate-900/30 p-2 rounded items-center justify-center">
                                        <span class="text-slate-500 font-bold text-[9px] uppercase">Paused</span>
                                        <span class="font-mono font-bold text-rose-600 dark:text-rose-400 text-sm">${data.stats.paused}</span>
                                    </div>

                                    <!-- Period -->
                                    <div class="col-span-2 flex flex-col bg-slate-300/50 dark:bg-slate-900/30 p-2 rounded items-center justify-center">
                                        <span class="text-slate-500 font-bold text-[9px] uppercase">Period</span>
                                        <span class="font-mono font-bold text-purple-600 dark:text-purple-300 text-[10px] text-center truncate w-full" title="${data.stats.qualityPeriod}">${data.stats.qualityPeriod}</span>
                                    </div>
                                    <!-- Rotation -->
                                    <div class="flex flex-col bg-slate-300/50 dark:bg-slate-900/30 p-2 rounded items-center justify-center">
                                        <span class="text-slate-500 font-bold text-[9px] uppercase">Rotation</span>
                                        <span class="font-mono font-bold text-orange-600 dark:text-orange-400 text-[10px] text-center truncate w-full" title="${data.stats.rotation}">${data.stats.rotation}</span>
                                    </div>

                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            return `
                <div class="glass-card rounded-[2rem] overflow-hidden mb-6 animate-fade-in border-t-4 border-indigo-500 transition-all duration-300">
                    <div class="p-6 flex flex-col md:flex-row items-center justify-between gap-6 cursor-pointer bg-slate-100/40 dark:bg-slate-900/40 hover:bg-slate-200/40 dark:hover:bg-slate-900/60 transition-colors" onclick="window.toggleEntity('${entity.id}')">
                        
                        <div class="flex items-center gap-4 min-w-[150px]">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-blue-600 flex items-center justify-center shadow-lg ring-2 ring-black/5 dark:ring-white/10">
                                <span class="font-black text-white text-lg">${shortName}</span>
                            </div>
                            <div>
                                <h2 class="text-2xl font-black text-slate-800 dark:text-white tracking-tighter">${entity.id}</h2>
                                <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">${activeCount} ACTIVE PLATFORMS</span>
                            </div>
                        </div>

                        <div class="flex-1 grid grid-cols-2 md:grid-cols-5 gap-4 w-full">
                            <div class="text-center">
                                <span class="block text-[9px] font-bold text-blue-500 dark:text-blue-400 uppercase">RDPs</span>
                                <span class="text-lg font-black text-slate-700 dark:text-white">${entity.globalStats.rdps || 0}</span>
                            </div>
                            <div class="text-center">
                                <span class="block text-[9px] font-bold text-emerald-600 dark:text-emerald-400 uppercase">Seeds</span>
                                <span class="text-lg font-black text-emerald-600 dark:text-emerald-400">${entity.globalStats.seeds || 0}</span>
                            </div>
                            <div class="text-center">
                                <span class="block text-[9px] font-bold text-purple-500 dark:text-purple-400 uppercase">Quality</span>
                                <span class="text-lg font-black text-slate-700 dark:text-white">${entity.globalStats.qual || 0}</span>
                            </div>
                            <div class="text-center">
                                <span class="block text-[9px] font-bold text-rose-500 dark:text-rose-400 uppercase">Paused</span>
                                <span class="text-lg font-black text-rose-600 dark:text-rose-400">${entity.globalStats.pause || 0}</span>
                            </div>
                            <div class="text-center">
                                <span class="block text-[9px] font-bold text-orange-500 dark:text-orange-400 uppercase">Proxy</span>
                                <span class="text-lg font-black text-slate-700 dark:text-white">${entity.globalStats.proxy || 0}</span>
                            </div>
                        </div>

                        <div class="transform transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}">
                            <svg class="w-6 h-6 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>
                    </div>

                    <div class="accordion-content ${isExpanded ? 'open' : ''}">
                        <div class="p-6 bg-slate-50/50 dark:bg-slate-950/30 border-t border-black/5 dark:border-white/5">
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                                ${platformsHTML}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Main Logic ---

        async function loadData() {
            const refreshBtn = document.getElementById('refresh-btn');
            refreshBtn.innerHTML = 'Syncing...';
            refreshBtn.classList.add('opacity-50', 'cursor-not-allowed');
            
            state.loading = true;
            
            // Render basic loader
            if (state.entities.length === 0) {
                 document.getElementById('entities-list').innerHTML = `
                    <div class="text-center py-20">
                        <div class="loader mx-auto mb-4"></div>
                        <p class="text-slate-400 font-bold uppercase text-xs">Establishing Secure Connections...</p>
                    </div>
                 `;
            }

            const promises = Object.keys(ENTITY_CONFIGS).map(id => fetchEntityData(id));
            state.entities = await Promise.all(promises);
            state.loading = false;

            refreshBtn.innerHTML = '↻ Refresh';
            refreshBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('last-updated').innerText = new Date().toLocaleTimeString();

            renderApp();
        }

        function renderApp() {
            // Calculate Totals for Top Bar
            const totals = {
                rdps: 0, seeds: 0, qual: 0, pause: 0, proxy: 0,
                sessions: 0, deploysHr: 0, deploysDay: 0, lancements: 0, seedsHr: 0, seedsDay: 0
            };

            state.entities.forEach(entity => {
                // Basic global stats
                totals.rdps += entity.globalStats.rdps;
                totals.seeds += entity.globalStats.seeds;
                totals.qual += entity.globalStats.qual;
                totals.pause += entity.globalStats.pause;
                totals.proxy += entity.globalStats.proxy;

                // Detailed stats aggregation (Sum of all platforms)
                Object.values(entity.platforms).forEach(plat => {
                    const s = plat.stats;
                    totals.sessions += s.sessions;
                    totals.deploysHr += s.deploysHr;
                    totals.deploysDay += s.deploysDay;
                    totals.lancements += s.lancements;
                    totals.seedsHr += s.seedsHr;
                    totals.seedsDay += s.seedsDay;
                });
            });

            // Render Global Stats
            const globalGrid = document.getElementById('global-stats-grid');
            globalGrid.innerHTML = `
                ${renderStatCard('Total RDPs', totals.rdps, 'text-blue-500 dark:text-blue-400', '')}
                ${renderStatCard('Total Seeds', totals.seeds, 'text-emerald-600 dark:text-emerald-400', '')}
                ${renderStatCard('Total Sessions', totals.sessions, 'text-slate-700 dark:text-white', '')}
                
                ${renderStatCard('Total Deploys/hour', totals.deploysHr, 'text-indigo-500 dark:text-indigo-400', '')}
                ${renderStatCard('Total Deploys/day', totals.deploysDay, 'text-indigo-500 dark:text-indigo-400', '')}
                ${renderStatCard('Total Launches', totals.lancements, 'text-slate-700 dark:text-white', '')}
                
                ${renderStatCard('Total Seeds/hour', totals.seedsHr, 'text-teal-600 dark:text-teal-400', '')}
                ${renderStatCard('Total Seeds/day', totals.seedsDay, 'text-teal-600 dark:text-teal-400', '')}
                
                ${renderStatCard('Total Quality', totals.qual, 'text-purple-500 dark:text-purple-400', '')}
                ${renderStatCard('Total Paused', totals.pause, 'text-rose-500 dark:text-rose-400', '')}
                ${renderStatCard('Total Proxy', totals.proxy, 'text-orange-500 dark:text-orange-400', '')}
            `;

            // Render Entities
            const listContainer = document.getElementById('entities-list');
            listContainer.innerHTML = state.entities.map(renderEntityRow).join('');
        }

        // --- Initialization ---

        // Global functions for HTML interaction
        window.toggleEntity = (id) => {
            if (state.expandedEntities.has(id)) {
                state.expandedEntities.delete(id);
            } else {
                state.expandedEntities.add(id);
            }
            renderApp(); // Re-render to update classes
        };

        window.manualRefresh = () => {
            if (!state.loading) loadData();
        };

        // Star Background Generation (Adjusted for theme)
        function generateStars() {
            const container = document.getElementById('stars-container');
            let html = '';
            
            // Random static stars
            for (let i = 0; i < 50; i++) {
                const top = Math.random() * 100;
                const left = Math.random() * 100;
                const size = Math.random() * 2 + 1;
                html += `<div class="absolute rounded-full star-dot opacity-40" style="top: ${top}%; left: ${left}%; width: ${size}px; height: ${size}px;"></div>`;
            }

            // Twinkling stars
            html += `<div class="absolute top-[10%] left-[20%] w-1 h-1 star-dot rounded-full animate-ping" style="animation-duration: 3s"></div>`;
            html += `<div class="absolute top-[30%] left-[60%] w-1 h-1 star-dot rounded-full animate-ping" style="animation-duration: 5s"></div>`;
            html += `<div class="absolute top-[70%] left-[40%] w-1 h-1 star-dot rounded-full animate-ping" style="animation-duration: 4s"></div>`;
            
            container.innerHTML = html;
        }

        // Start
        generateStars();
        document.getElementById('refresh-btn').addEventListener('click', loadData);
        
        // Initial load
        loadData();

        // Auto-refresh interval (60s)
        setInterval(loadData, 60000);

    </script>
  </body>
</html>
