<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMSW Dashboard - Realtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: { 'blob': 'blob 10s infinite' },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for Edit/Add buttons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .dark body {
            background-color: #020617;
            color: #f8fafc;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        
        /* Glassmorphism utilities */
        .glass-card {
            transition: background 0.3s ease, border-color 0.3s ease;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.70);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .dark .glass-card {
            background: rgba(15, 23, 42, 0.70);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        /* Cosmic Background Animation */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .animate-bg {
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Loader */
        .loader {
            border: 4px solid rgba(59, 130, 246, 0.1);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Accordion transition */
        .accordion-content {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 5000px;
            opacity: 1;
        }
        .rotate-180 { transform: rotate(180deg); }

        .star-dot { background-color: #94a3b8; }
        .dark .star-dot { background-color: #ffffff; }

        /* Modal Styles */
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        dialog {
            background: transparent;
            border: none;
            padding: 0;
            margin: auto;
        }
        .disabled-entity {
            opacity: 0.6;
            filter: grayscale(1);
        }
        
        .stat-label {
            font-size: 0.6rem;
            line-height: 1;
            text-transform: uppercase;
            font-weight: 700;
            color: #64748b;
        }
        .dark .stat-label { color: #94a3b8; }

        /* Login Overlay Styles */
        #loginOverlay {
            background: rgba(2, 6, 23, 0.95); /* Dark background by default for cosmic feel */
            backdrop-filter: blur(12px);
            position: fixed;
            inset: 0;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            display: flex;
            flex-direction: column;
        }
        
        .login-input {
            color: #0f172a !important;
            background-color: rgba(255, 255, 255, 0.9) !important;
        }
        .dark .login-input {
            color: #f8fafc !important;
            background-color: rgba(30, 41, 59, 0.8) !important;
        }

    </style>
  <script type="importmap">
{
  "imports": {
    "firebase/": "https://esm.sh/firebase@^10.13.1/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body class="min-h-screen relative p-4 md:p-8 overflow-x-hidden">

    <!-- Backgrounds -->
    <div class="fixed inset-0 -z-10 bg-gradient-to-br from-blue-50 via-slate-100 to-white dark:from-slate-900 dark:via-[#0f172a] dark:to-black animate-bg transition-colors duration-500"></div>
    <div class="fixed inset-0 -z-10 opacity-60 pointer-events-none" id="stars-container"></div>

    <!-- Login Overlay -->

        <div class="glass-card p-10 rounded-[2.5rem] w-full max-w-sm text-center border shadow-2xl relative overflow-hidden">
            <div class="relative z-10">
                <div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-blue-800 rounded-3xl mx-auto mb-6 flex items-center justify-center shadow-xl ring-4 ring-blue-500/20">
                    <span class="text-white text-3xl font-black italic">W</span>

                <h2 class="text-3xl font-black mb-2 uppercase tracking-tighter text-slate-800 dark:text-white">DASHBOARD ACCESS</h2>

                <button onclick="window.checkAccess()" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white p-4 rounded-2xl font-black uppercase shadow-lg transform hover:scale-105 transition-all">Unlock Dashboard</button>
            </div>
        </div>
    </div>

            <div>

        <!-- Global Stats Section -->

            System Synchronized

        <div class="glass-card p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 max-h-[85vh] overflow-y-auto flex flex-col">
            <div class="flex justify-between items-center mb-6 border-b border-slate-200 dark:border-slate-800 pb-4">

    <!-- Edit/Add Modal -->

        <div class="glass-card p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 max-h-[90vh] overflow-y-auto">

                    <div>

                    <div>
                        <label class="text-[10px] uppercase font-bold text-slate-500">Deploys/Hour</label>
                        <input type="number" id="edit-deploysHr" class="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-300 dark:border-slate-600 dark:text-white font-mono text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase font-bold text-slate-500">Deploys/Day</label>

                    </div>

                    <div>
                        <label class="text-[10px] uppercase font-bold text-slate-500">Seeds/Hour</label>
                        <input type="number" id="edit-seedsHr" class="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-300 dark:border-slate-600 dark:text-white font-mono text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase font-bold text-slate-500">Seeds/Day</label>
                        <input type="number" id="edit-seedsDay" class="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-300 dark:border-slate-600 dark:text-white font-mono text-sm">
                    </div>
                    
                    <div class="col-span-full border-t border-slate-200 dark:border-slate-700 my-1"></div>
                    
                    <div class="col-span-full">
                        <label class="text-[10px] uppercase font-bold text-slate-500">Period (Start-End)</label>
                        <input type="text" id="edit-period" class="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-300 dark:border-slate-600 dark:text-white font-mono text-sm">
                    </div>
                    <div class="col-span-full">
                        <label class="text-[10px] uppercase font-bold text-slate-500">Rotation</label>
                        <input type="text" id="edit-rotation" class="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-300 dark:border-slate-600 dark:text-white font-mono text-sm">

                <!-- NEW ENTITY FIELDS -->

                                <input type="text" id="new-entity-projectid" class="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-300 dark:border-slate-600 dark:text-white font-mono text-sm">

                        </div>
                        <div>
                            <label class="text-[10px] uppercase font-bold text-slate-500">Database URL</label>
                            <input type="text" id="new-entity-dburl" placeholder="https://..." class="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-300 dark:border-slate-600 dark:text-white font-mono text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                 <label class="text-[10px] uppercase font-bold text-slate-500">Auth Domain</label>
                                 <input type="text" id="new-entity-authdomain" class="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-300 dark:border-slate-600 dark:text-white font-mono text-sm">
                            </div>
                            <div>
                                 <label class="text-[10px] uppercase font-bold text-slate-500">App ID</label>
                                 <input type="text" id="new-entity-appid" class="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-300 dark:border-slate-600 dark:text-white font-mono text-sm">

                <div class="flex gap-2 mt-6 pt-4 border-t border-slate-200 dark:border-slate-700">
                    <button type="button" onclick="document.getElementById('editor-modal').close()" class="flex-1 py-2 rounded-lg text-xs font-bold uppercase bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors dark:text-white">Cancel</button>
                    <button type="submit" class="flex-1 py-2 rounded-lg text-xs font-bold uppercase bg-blue-600 text-white hover:bg-blue-500 transition-colors shadow-lg shadow-blue-500/30">Save Data</button>
                </div>
            </form>
        </div>
    </dialog>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
        import { getDatabase, ref, onValue, update, set, remove, push } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js';

        // --- AUTH CONFIG ---
        const AUTH_URL = "https://dashboard-emsw.alamiuness.workers.dev";
        
        // Allowed Entities for EMSW Role - Restricted to specified IDs
        const EMSW_ALLOWED_ENTITIES = ['EMH', 'EMK1', 'EMK2', 'EMK3'];

        // Default to viewer initially
        let userRole = 'VIEWER'; 

        // --- SAFE DOM HELPERS ---
        // Prevent crashes if an input element is commented out or missing
        const getVal = (id) => document.getElementById(id)?.value || '';
        const getInt = (id) => {
            const val = document.getElementById(id)?.value;
            return val === '' ? null : (parseInt(val) || 0);
        };
        const setVal = (id, val) => { const el = document.getElementById(id); if(el) el.value = val; };

        // --- SORTING STATE (Now synced via DB for SUPER) ---
        let entitySortOrder = JSON.parse(localStorage.getItem('entitySortOrder') || '[]');
        
        // --- GLOBAL CONTENT STATE ---
        let globalContent = { current: '', needed: '' };
        
        // --- EMSW PARTNERSHIP STATE ---
        let emswStatusState = {};

        // --- AUTH & INIT LOGIC ---
        function checkAuthOnLoad() {
            const key = localStorage.getItem('emsw_key');
            const role = localStorage.getItem('emsw_role');
            
            if (key === 'valid' && role) {
                // SUCCESS: Logged in

        // --- DATA EXTRACTION HELPER ---
        function findMetric(obj, keys, type = 'int') {
            if (!obj) return type === 'string' ? '-' : 0;
            const objKeys = Object.keys(obj);
            const objKeysLower = objKeys.map(k => k.toLowerCase().trim());
            
            for (const key of keys) {
                const searchKey = key.toLowerCase().trim();
                const idx = objKeysLower.indexOf(searchKey);
                if (idx !== -1) {
                    const val = obj[objKeys[idx]];
                    if (val !== undefined && val !== null && val !== '') {
                        if (type === 'int') {
                            const p = parseInt(val, 10);
                            return isNaN(p) ? 0 : p;
                        }
                        return val;
                    }
                }
            }
            return type === 'string' ? '-' : 0;
        }

        function processPlanData(rawPlans, rootPath, entityId) {
             const platforms = {};
             const allowed = ALLOWED_PLATFORMS[entityId];

             Object.keys(rawPlans).forEach(key => {
                if (allowed && !allowed.includes(key)) return;

                const planData = rawPlans[key] || {};
                const currentData = planData.current || {};
                
                const searchObj = { 
                    ...planData,
                    ...(planData.stats || {}), 
                    ...currentData, 
                    ...(currentData.stats || {}) 
                };

                if (Object.keys(searchObj).length > 0 || planData.deploys || currentData.deploys) {
                    let activeDeploysCount = 0;
                    let deploysObj = planData.deploys || currentData.deploys;
                    
                    if (deploysObj && typeof deploysObj === 'object') {
                        if (Array.isArray(deploysObj)) {
                            activeDeploysCount = deploysObj.filter(d => d).length;
                        } else {
                            activeDeploysCount = Object.keys(deploysObj).length;
                        }
                    } 
                    
                    if (activeDeploysCount === 0) {
                        activeDeploysCount = findMetric(searchObj, [
                            'nbrdeploysperhour', 'active_deploys', 'activeDeploys', 'Deploys/h', 'deploys_per_hour',
                            'nbrdeploys', 'nbr_deploys', 'total_deploys', 'deploys'
                        ]);
                    }

                    const lancements = findMetric(searchObj, ['nbrlancement', 'Lancements', 'Launches', 'launches', 'lancement']);
                    const calculatedDeploysDay = activeDeploysCount * lancements;

                    const stats = {
                            seeds: findMetric(searchObj, ['Seeds', 'seeds', 'SEEDS', 'nbrseeds']),
                            rdps: findMetric(searchObj, ['RDPs', 'rdps', 'RDP', 'nbrrdp']),
                            sessions: findMetric(searchObj, ['Sessions', 'sessions', 'nbrsession']),
                            deploysHr: activeDeploysCount,
                            deploysDay: calculatedDeploysDay,
                            seedsHr: findMetric(searchObj, ['nbrseedsperhour', 'Seeds/h', 'Seeds/Hour', 'seedsHr']),
                            seedsDay: findMetric(searchObj, ['nbrseedsperday', 'Seeds/d', 'Seeds/Day', 'seedsDay']),
                            lancements: lancements,
                            quality: findMetric(searchObj, ['Quality', 'quality', 'Qual']),
                            paused: findMetric(searchObj, ['Paused', 'paused', 'Pause']),
                            period: findMetric(searchObj, ['period', 'Period', 'date_range'], 'string'),
                            rotation: findMetric(searchObj, ['Rotation', 'rotation'], 'string')
                    };
                    
                    platforms[key] = {
                        stats: stats,
                        updatedAt: currentData.updatedAt || planData.updatedAt || '',
                        path: `${rootPath}/plans/${key}`
                    };
                }
            });
            return platforms;
        }

        // --- ENTITY LISTENER LOGIC ---
        function connectEntity(entityId) {
            if (connectedEntityIds.has(entityId)) return;
            
            const config = ALL_ENTITY_CONFIGS[entityId];
            const isDisabled = config.disabled || localDisabledStore[entityId];
            
            if (!appState[entityId]) {
                appState[entityId] = { globalStats: {}, platforms: {}, rawData: null, disabled: isDisabled };
            } else {
                appState[entityId].disabled = isDisabled;
            }

            try {
                if (config && config.manual) {
                    const manualRoot = `manual_data/${entityId}`;
                    const manualPlansRef = ref(masterDb, `${manualRoot}/plans`);
                    const manualGlobalRef = ref(masterDb, `${manualRoot}/global_stats`);

                    onValue(manualPlansRef, (snapshot) => {
                         const rawPlans = snapshot.val() || {};
                         const platforms = processPlanData(rawPlans, `${entityId}/plans`, entityId);
                         appState[entityId].platforms = platforms;
                         requestRender();
                    });
                    
                    onValue(manualGlobalRef, (snapshot) => {
                         const val = snapshot.val() || {};
                         appState[entityId].globalStats = {
                             rdps: findMetric(val, ['glb_rdps', 'Total RDPs', 'RDPs'], 'int'),
                             paused: findMetric(val, ['Paused'], 'int'),
                             proxy: findMetric(val, ['proxy', 'Proxy'], 'int')
                         };
                         requestRender();
                    });

                    connectedEntityIds.add(entityId);
                    return;
                }

                const app = getEntityApp(entityId);
                const db = getDatabase(app);
                const rootPath = entityId.toLowerCase();
                
                const plansRef = ref(db, `${rootPath}/plans`);
                const globalRef = ref(db, `${rootPath}/global_stats`);

                onValue(plansRef, (snapshot) => {
                    const rawPlans = snapshot.val() || {};
                    const platforms = processPlanData(rawPlans, rootPath, entityId);
                    appState[entityId].platforms = platforms;
                    requestRender();
                });

                onValue(globalRef, (snapshot) => {
                    const val = snapshot.val() || {};
                    appState[entityId].globalStats = {
                        rdps: findMetric(val, ['glb_rdps', 'Total RDPs', 'RDPs'], 'int'),
                        paused: findMetric(val, ['Paused'], 'int'),
                        proxy: findMetric(val, ['proxy', 'Proxy', 'PROXY'], 'int')
                    };
                    requestRender();
                });

                connectedEntityIds.add(entityId);
            } catch (e) {
                console.error("Connection error for " + entityId, e);
            }
        }

            const customEntitiesRef = ref(masterDb, 'custom_entities');
            onValue(customEntitiesRef, (snapshot) => {
                const customData = snapshot.val() || {};
                
                const currentCustomIds = Object.keys(ALL_ENTITY_CONFIGS).filter(id => !BUILTIN_CONFIGS[id]);
                const newCustomIds = Object.keys(customData);

                currentCustomIds.forEach(id => {
                    if (!customData[id]) {
                        delete ALL_ENTITY_CONFIGS[id];
                        delete appState[id];
                        connectedEntityIds.delete(id);
                    }
                });

                newCustomIds.forEach(id => {
                    ALL_ENTITY_CONFIGS[id] = customData[id];
                    connectEntity(id); 
                });

                requestRender();
            });

        // --- SORTING FUNCTION ---
        window.moveEntity = async (entityId, direction) => {
            if(userRole !== 'SUPER') return;
            
            // If not found in current sort order, rebuild the list first based on current view
            let currentList = [...entitySortOrder];
            
            // Ensure all current keys are in the list
            const allKeys = Object.keys(ALL_ENTITY_CONFIGS);
            allKeys.forEach(k => { if(!currentList.includes(k)) currentList.push(k); });
            
            // Remove keys that no longer exist
            currentList = currentList.filter(k => allKeys.includes(k));

            const currentIdx = currentList.indexOf(entityId);
            if (currentIdx === -1) return;

            const newIdx = currentIdx + direction;
            if (newIdx < 0 || newIdx >= currentList.length) return;

            // Swap
            const temp = currentList[newIdx];
            currentList[newIdx] = currentList[currentIdx];
            currentList[currentIdx] = temp;

            entitySortOrder = currentList;
            
            // Persist to Firebase so EMSW users see it
            try {
                await set(ref(masterDb, 'settings/entity_order'), entitySortOrder);
            } catch(e) {
                console.error("Failed to sync sort order", e);

                localStorage.setItem('entitySortOrder', JSON.stringify(entitySortOrder));

                        const s = pData.stats;
                        const launches = s.lancements || 0;
                        const time = pData.updatedAt ? (pData.updatedAt.split(' ')[1] || pData.updatedAt) : '';
                        
                        // Condition to show FULL CARD:
                        // 1. If launches > 0 (Active)
                        // 2. OR if user is SUPER
                        // 3. OR if user is EMSW
                        const showFullCard = launches > 0 || userRole === 'SUPER' || userRole === 'EMSW';
                        
                        // If it's a 0-launch platform and restricted user (ADMIN), show restricted view?
                        // If showFullCard is false, it means launches == 0 AND user is not SUPER/EMSW.
                        
                        if (showFullCard) {
                            const editBtn = canEdit ? `
                                <button onclick="window.openEditModal('${entityId}', '${pName}')" class="absolute top-2 right-2 p-1 rounded hover:bg-black/10 dark:hover:bg-white/10 text-slate-400 hover:text-blue-500 transition-colors z-10" title="Edit">
                                    <i class="ph ph-pencil-simple"></i>
                                </button>
                            ` : '';

                            // Allow Delete for EMSW too if they have permission
                            const deletePlatformBtn = canEdit ? `
                                <button onclick="window.deletePlatform('${entityId}', '${pName}')" class="absolute top-2 right-8 p-1 rounded hover:bg-rose-500/10 text-slate-400 hover:text-rose-500 transition-colors z-10" title="Delete Platform">
                                    <i class="ph ph-trash"></i>
                                </button>
                            ` : '';

                            platformsHTML += `
                            <div class="relative bg-slate-200/50 dark:bg-slate-800/40 rounded-xl p-4 border border-black/5 dark:border-white/5 hover:border-black/10 dark:hover:border-white/10 transition-colors flex flex-col h-full group ${launches === 0 ? 'opacity-75' : ''}">
                                ${editBtn}
                                ${deletePlatformBtn}
                                <div class="flex justify-between items-start mb-3 pr-12">
                                    <h4 class="font-black text-sm text-indigo-500 dark:text-indigo-300 uppercase truncate max-w-[85%]" title="${pName}">${pName}</h4>
                                    ${time ? `<span class="text-[9px] text-slate-500 bg-white/50 dark:bg-slate-900/50 px-2 py-0.5 rounded whitespace-nowrap">${time}</span>` : ''}
                                </div>
                                
                                <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-2 mt-auto">
                                    ${renderMiniMetric('Seeds', s.seeds, 'text-emerald-600 dark:text-emerald-400')}
                                    ${renderMiniMetric('RDPs', s.rdps, 'text-blue-600 dark:text-blue-400')}
                                    ${renderMiniMetric('Sessions', s.sessions, 'text-slate-600 dark:text-slate-300')}
                                    
                                    ${renderMiniMetric('Seeds/h', s.seedsHr, 'text-teal-600 dark:text-teal-400')}
                                    ${renderMiniMetric('Seeds/d', s.seedsDay, 'text-teal-600 dark:text-teal-400')}
                                    ${renderMiniMetric('Launches', s.lancements, 'text-orange-500 dark:text-orange-400')}
                                    
                                    ${renderMiniMetric('Deploys/h', s.deploysHr, 'text-indigo-600 dark:text-indigo-400')}
                                    ${renderMiniMetric('Deploys/d', s.deploysDay, 'text-indigo-600 dark:text-indigo-400')}
                                    ${renderMiniMetric('Quality', s.quality, 'text-purple-600 dark:text-purple-400')}
                                </div>

                                <div class="mt-3 space-y-2 pt-3 border-t border-slate-300/50 dark:border-slate-700/50">
                                    <div class="flex justify-between items-center text-[10px]">
                                        <span class="text-slate-500 font-bold uppercase">Quality Period</span>
                                        <span class="font-mono text-slate-700 dark:text-slate-300 truncate max-w-[140px]" title="${s.period}">${s.period || '-'}</span>
                                    </div>
                                    <div class="flex justify-between items-center text-[10px]">
                                        <span class="text-slate-500 font-bold uppercase">Rotation</span>
                                        <span class="font-mono text-slate-700 dark:text-slate-300 truncate max-w-[140px]" title="${s.rotation}">${s.rotation || '-'}</span>
                                    </div>
                                </div>
                            </div>`;
                        } else {
                            // RESTRICTED VIEW (0 Launches, Not Super/EMSW)
                            // Show only Name and Seeds
                            platformsHTML += `
                                <div class="relative bg-slate-200/50 dark:bg-slate-800/40 rounded-xl p-4 border border-black/5 dark:border-white/5 flex flex-col justify-center items-center h-full opacity-60">
                                    <h4 class="font-black text-sm text-slate-500 uppercase truncate mb-2" title="${pName}">${pName}</h4>
                                    ${renderMiniMetric('Seeds', s.seeds, 'text-emerald-600 dark:text-emerald-400')}
                                    <div class="mt-2 text-[9px] font-bold text-slate-400 uppercase tracking-widest">WITHOUT REPORTING PLAN</div>
                                </div>
                            `;
                        }
                    });
                }

                let addBtn = '';
                if (canEdit) {
                    addBtn = `
                        <button onclick="window.openAddPlatformModal('${entityId}')" class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-blue-500 dark:hover:border-blue-500 text-slate-400 hover:text-blue-500 transition-all min-h-[280px] group">
                            <i class="ph ph-plus-circle text-3xl mb-2 group-hover:scale-110 transition-transform"></i>
                            <span class="text-xs font-bold uppercase">Add Platform</span>
                        </button>
                    `;
                }

                let controlsBtn = '';
                
                // Logic for EMSW Partnership
                // If value is undefined or true, they are partners. If false, they are NOT partners (show star).
                const isEmswPartner = emswStatusState[entityId] !== false;
                const starIndicator = !isEmswPartner ? '<span class="text-amber-400 text-[12px] ml-2 drop-shadow-md animate-pulse" title="Not working with EMSW">★</span>' : '';
                
                if (canEdit) { 
                    const isBuiltIn = !!BUILTIN_CONFIGS[entityId];
                    const deleteBtn = (userRole === 'SUPER' && !isBuiltIn) ? `
                        <button onclick="event.stopPropagation(); window.deleteEntity('${entityId}')" class="text-rose-500 hover:text-rose-600 dark:hover:text-rose-400 p-2 bg-rose-500/10 rounded-full hover:bg-rose-500/20 transition-colors" title="Delete">
                            <i class="ph ph-trash text-lg"></i>
                        </button>` : '';
                    
                    const toggleStateBtn = userRole === 'SUPER' ? `
                        <button onclick="event.stopPropagation(); window.toggleEntityState('${entityId}')" class="${isDisabled ? 'text-slate-400' : 'text-green-500'} p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors" title="${isDisabled ? 'Enable' : 'Disable'}">
                            <i class="ph ${isDisabled ? 'ph-toggle-left' : 'ph-toggle-right'} text-2xl"></i>
                        </button>
                    ` : '';

                    const moveBtns = userRole === 'SUPER' ? `
                        <div class="flex flex-col mr-2 border-r border-slate-300 dark:border-slate-700 pr-2">
                            <button onclick="event.stopPropagation(); window.moveEntity('${entityId}', -1)" class="hover:text-blue-500 text-slate-400"><i class="ph ph-caret-up"></i></button>
                            <button onclick="event.stopPropagation(); window.moveEntity('${entityId}', 1)" class="hover:text-blue-500 text-slate-400"><i class="ph ph-caret-down"></i></button>
                        </div>
                    ` : '';
                    
                    // Button to toggle EMSW partnership (Only SUPER)
                    const emswBtn = (userRole === 'SUPER') ? `
                        <button onclick="event.stopPropagation(); window.toggleEmswPartnership('${entityId}')" class="p-2 rounded-full transition-colors mr-2 ${isEmswPartner ? 'bg-blue-500/10 text-blue-500' : 'bg-amber-500/10 text-amber-500'}" title="${isEmswPartner ? 'Working with EMSW (Click to disable)' : 'Not working with EMSW (Click to enable)'}">
                            <i class="ph ${isEmswPartner ? 'ph-handshake' : 'ph-star'} text-xl"></i>
                        </button>
                    ` : '';

                    controlsBtn = `
                        <div class="absolute top-6 right-16 flex items-center gap-2 z-20">
                            ${emswBtn}
                            ${toggleStateBtn}
                            ${deleteBtn}
                        </div>
                    `;

                    var moveControls = moveBtns; 
                } else {
                    var moveControls = '';
                }

                let proxyDisplay = `<span class="text-lg font-black text-slate-700 dark:text-white">${entityTotals.proxy}</span>`;
                if (canEdit && !isDisabled) {
                    proxyDisplay += `
                        <button onclick="event.stopPropagation(); window.openGlobalStatsModal('${entityId}')" class="ml-1 text-xs text-slate-400 hover:text-blue-500"><i class="ph ph-pencil-simple"></i></button>
                    `;
                }

                return `
                <div class="glass-card rounded-[2rem] overflow-hidden mb-6 animate-fade-in border-t-4 ${isDisabled ? 'border-slate-400' : 'border-indigo-500'} transition-all duration-300 relative ${opacityClass}">
                    ${controlsBtn}
                    <div class="p-6 flex flex-col md:flex-row items-center justify-between gap-6 cursor-pointer bg-slate-100/40 dark:bg-slate-900/40 hover:bg-slate-200/40 dark:hover:bg-slate-900/60 transition-colors" onclick="window.toggleEntity('${entityId}')">
                        
                        <div class="flex items-center gap-4 min-w-[150px]">
                            ${moveControls}
                            <div>
                                <h2 class="text-2xl font-black text-slate-800 dark:text-white tracking-tighter flex items-center">
                                    ${entityId} 
                                    ${starIndicator}
                                    ${isDisabled ? '<span class="text-xs font-normal text-red-500 uppercase ml-2">(Inactive)</span>' : ''}
                                </h2>
                                <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">${activePlatforms.length} Active • ${allPlatforms.length} Total</span>
                            </div>
                        </div>

                        <div class="flex-1 grid grid-cols-5 gap-2 w-full max-w-2xl">
                            <div class="text-center"><span class="block text-[9px] font-bold text-blue-500 uppercase">RDPs</span><span class="text-lg font-black text-slate-700 dark:text-white">${entityTotals.rdps}</span></div>
                            <div class="text-center"><span class="block text-[9px] font-bold text-emerald-500 uppercase">Seeds</span><span class="text-lg font-black text-slate-700 dark:text-white">${entityTotals.seeds}</span></div>
                            <div class="text-center"><span class="block text-[9px] font-bold text-purple-500 uppercase">Quality</span><span class="text-lg font-black text-slate-700 dark:text-white">${entityTotals.qual}</span></div>
                            <div class="text-center"><span class="block text-[9px] font-bold text-orange-500 uppercase">Proxy</span>${proxyDisplay}</div>
                        </div>

                        <div class="transform transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}">
                            <i class="ph ph-caret-down text-xl text-slate-400"></i>
                        </div>
                    </div>

                    <div class="accordion-content ${isExpanded ? 'open' : ''}">
                        <div class="p-6 bg-slate-50/50 dark:bg-slate-950/30 border-t border-black/5 dark:border-white/5">
                            <div class="flex flex-col lg:flex-row gap-6">
                                <div class="flex-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4">
                                    ${platformsHTML}
                                    ${addBtn}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('entities-list').innerHTML = listHtml;
            
            if (userRole === 'SUPER') {
                document.getElementById('super-admin-controls').classList.remove('hidden');
            } else {
                document.getElementById('super-admin-controls').classList.add('hidden');
            }
        }

        window.toggleEntity = (id) => {
            if (expandedEntities.has(id)) expandedEntities.delete(id);
            else expandedEntities.add(id);
            renderUI();
        };

        window.toggleEntityFields = () => {
             const type = document.querySelector('input[name="entityType"]:checked').value;
             const container = document.getElementById('api-config-container');
             if (type === 'api') container.classList.remove('hidden');
             else container.classList.add('hidden');
        };

        // --- EDITOR LOGIC ---
        function setModalView(mode) {
             const editFields = document.getElementById('edit-data-fields');
             const newPlatFields = document.getElementById('new-platform-fields');
             const newEntityFields = document.getElementById('new-entity-fields');
             const globalFields = document.getElementById('edit-global-fields');
             document.getElementById('edit-mode').value = mode;

             editFields.classList.add('hidden');
             newPlatFields.classList.add('hidden');
             newEntityFields.classList.add('hidden');
             globalFields.classList.add('hidden');

             if (mode === 'data') {
                 editFields.classList.remove('hidden');
             } else if (mode === 'platform') {
                 editFields.classList.remove('hidden'); 
                 newPlatFields.classList.remove('hidden');
             } else if (mode === 'entity') {
                 newEntityFields.classList.remove('hidden');
                 document.querySelector('input[name="entityType"][value="api"]').checked = true;
                 window.toggleEntityFields();
             } else if (mode === 'global') {
                 globalFields.classList.remove('hidden');
             }
        }

        window.openEditModal = (entityId, platformKey) => {
            if (!canEditEntity(entityId)) {
                return alert("Access Denied: You do not have permission to edit this entity.");
            }

            const data = appState[entityId].platforms[platformKey];
            const stats = data.stats;
            
            document.getElementById('modal-title').innerText = `Edit: ${platformKey}`;
            setVal('edit-entity-id', entityId);
            setVal('edit-platform-id', platformKey);
            
            setVal('edit-seeds', stats.seeds || 0);
            setVal('edit-rdps', stats.rdps || 0);
            setVal('edit-sessions', stats.sessions || 0);
            setVal('edit-quality', stats.quality || 0);
            setVal('edit-deploysHr', stats.deploysHr || 0);
            setVal('edit-paused', stats.paused || 0);
            setVal('edit-deploysDay', stats.deploysDay || 0);
            setVal('edit-seedsHr', stats.seedsHr || 0);
            setVal('edit-seedsDay', stats.seedsDay || 0);
            setVal('edit-lancements', stats.lancements || 0);
            setVal('edit-period', stats.period || '');
            setVal('edit-rotation', stats.rotation || '');

            setModalView('data');
            document.getElementById('editor-modal').showModal();
        };

        window.openGlobalStatsModal = (entityId) => {
            if (!canEditEntity(entityId)) {
                return alert("Access Denied: You do not have permission to edit this entity.");
            }

            document.getElementById('modal-title').innerText = `Edit Manual Stats: ${entityId}`;
            setVal('edit-entity-id', entityId);
            setVal('edit-platform-id', 'GLOBAL');
            
            const gStats = appState[entityId].globalStats || {};
            setVal('edit-global-proxy', gStats.proxy || 0);
            setVal('edit-global-rdps', gStats.rdps || 0);
            
            setModalView('global');
            document.getElementById('editor-modal').showModal();
        };

        window.openAddPlatformModal = (entityId) => {
            if (!canEditEntity(entityId)) {
                return alert("Access Denied: You do not have permission to edit this entity.");
            }

            document.getElementById('modal-title').innerText = `Add Platform to ${entityId}`;
            document.getElementById('editor-form').reset();
            setVal('edit-entity-id', entityId);
            setVal('edit-platform-id', 'NEW');
            
            setModalView('platform');
            document.getElementById('editor-modal').showModal();
        };

        window.openNewEntityModal = () => {
            if (userRole !== 'SUPER') return alert("Access Denied: Super Admin only.");
            document.getElementById('modal-title').innerText = `Add New Entity`;
            document.getElementById('editor-form').reset();
            setModalView('entity');
            document.getElementById('editor-modal').showModal();
        };

        window.toggleEntityState = async (entityId) => {
            if (userRole !== 'SUPER') return alert("Access Denied: Super Admin only.");

            const currentState = appState[entityId].disabled;
            const newState = !currentState;
            
            if (ALL_ENTITY_CONFIGS[entityId] && !BUILTIN_CONFIGS[entityId]) {
                try {
                    await update(ref(masterDb, 'custom_entities/' + entityId), { disabled: newState });
                } catch(e) {
                    alert("Error updating state: " + e.message);
                }
            } else {
                localDisabledStore[entityId] = newState;
                localStorage.setItem('disabledEntities', JSON.stringify(localDisabledStore));
                appState[entityId].disabled = newState;
                requestRender();
            }
        };

        window.deleteEntity = async (entityId) => {
            if (userRole !== 'SUPER') return alert("Access Denied: Super Admin only.");
            
            if (confirm(`Are you sure you want to delete ${entityId} and remove it for everyone?`)) {
                 try {
                     await remove(ref(masterDb, 'custom_entities/' + entityId));
                     await remove(ref(masterDb, 'manual_data/' + entityId));
                 } catch(e) {
                     alert("Error deleting entity: " + e.message);
                 }
            }
        };

        document.getElementById('editor-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mode = document.getElementById('edit-mode').value;
            
            if (mode === 'entity') {
                if (userRole !== 'SUPER') return alert("Access Denied");
                const id = document.getElementById('new-entity-id-input').value.toUpperCase().replace(/\s+/g, '');
                if (!id) return alert("Entity Name Required");
                
                const type = document.querySelector('input[name="entityType"]:checked').value;
                let config = {};

                if (type === 'api') {
                    config = {
                        apiKey: getVal('new-entity-apikey').trim(),
                        authDomain: getVal('new-entity-authdomain').trim(),
                        databaseURL: getVal('new-entity-dburl').trim(),
                        projectId: getVal('new-entity-projectid').trim(),
                        appId: getVal('new-entity-appid').trim()
                    };
                    if (!config.apiKey || !config.databaseURL) return alert("API Key and DB URL are required.");
                } else {
                    config = { manual: true };
                }

                try {
                    await update(ref(masterDb, 'custom_entities/' + id), config);
                    document.getElementById('editor-modal').close();
                } catch(err) {
                    alert("Failed to save entity to master DB: " + err.message);
                }
                return;
            }

            const entityId = getVal('edit-entity-id');
            
            if (!canEditEntity(entityId)) {
                return alert("Access Denied: You cannot modify this entity.");
            }

            const entityConfig = ALL_ENTITY_CONFIGS[entityId];

            if (mode === 'global') {
                const updates = {
                    proxy: getInt('edit-global-proxy'),
                    glb_rdps: getInt('edit-global-rdps'),
                };

                try {
                    if (entityConfig && entityConfig.manual) {
                        await update(ref(masterDb, `manual_data/${entityId}/global_stats`), updates);
                    } else {
                         const app = getEntityApp(entityId);
                         const db = getDatabase(app);
                         await update(ref(db, `${entityId.toLowerCase()}/global_stats`), updates);
                    }
                    document.getElementById('editor-modal').close();
                } catch (err) {
                    alert("Failed to save global stats: " + err.message);
                }
                return;
            }

            let platformId = getVal('edit-platform-id');
            
            if (platformId === 'NEW') {
                platformId = getVal('edit-name').toUpperCase().replace(/\s+/g, '_');
                if (!platformId) return alert("Platform Name required!");
            }

            if (mode === 'data' || mode === 'platform') {
                const requiredFields = [
                    { id: 'edit-seeds', label: 'Seeds' },
                    { id: 'edit-rdps', label: 'RDPs' },
                    { id: 'edit-sessions', label: 'Sessions' },
                    { id: 'edit-lancements', label: 'Launches' }
                ];
                
                for (let field of requiredFields) {
                    const val = document.getElementById(field.id).value;
                    if (val === '' || val === null) {
                         alert(`Le champ "${field.label}" est obligatoire !`);
                         return; // Stop submission
                    }
                }
            }

            const updates = {
                current: {
                    updatedAt: new Date().toISOString().replace('T', ' ').substring(0, 19),
                    seeds: getInt('edit-seeds'),
                    rdps: getInt('edit-rdps'),
                    sessions: getInt('edit-sessions'),
                    quality: getInt('edit-quality'),
                    nbrdeploysperhour: getInt('edit-deploysHr'),
                    paused: getInt('edit-paused'),
                    nbrdeploysperday: getInt('edit-deploysDay'),
                    nbrseedsperhour: getInt('edit-seedsHr'),
                    nbrseedsperday: getInt('edit-seedsDay'),
                    nbrlancement: getInt('edit-lancements'),
                    period: getVal('edit-period'),
                    rotation: getVal('edit-rotation'),
                }
            };

            try {
                if (entityConfig && entityConfig.manual) {
                    const path = `manual_data/${entityId}/plans/${platformId}`;
                    await update(ref(masterDb, path), updates);
                } else {
                    const app = getEntityApp(entityId);
                    const db = getDatabase(app);
                    const path = `${entityId.toLowerCase()}/plans/${platformId}`;
                    await update(ref(db, path), updates);
                }
                
                document.getElementById('editor-modal').close();
            } catch (err) {
                alert("Save failed: " + err.message);
            }
        });

        function generateStars() {
            const container = document.getElementById('stars-container');
            let html = '';
            for (let i = 0; i < 40; i++) {
                const top = Math.random() * 100;
                const left = Math.random() * 100;
                const size = Math.random() * 2 + 1;
                html += `<div class="absolute rounded-full star-dot opacity-40" style="top: ${top}%; left: ${left}%; width: ${size}px; height: ${size}px;"></div>`;
            }
            container.innerHTML = html;
        }
        generateStars();

        checkAuthOnLoad();

    </script>
  </body>
</html>
