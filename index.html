    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Light Mode Defaults */
        body {
            background-color: #f1f5f9; /* slate-100 */
            color: #0f172a; /* slate-900 */
        }

        /* Dark Mode Overrides */
        .dark body {
            background-color: #020617;
            color: #f8fafc;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        
        /* Glassmorphism utilities */
        .glass-card {
            transition: background 0.3s ease, border-color 0.3s ease;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.70);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .dark .glass-card {
            background: rgba(15, 23, 42, 0.70);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        /* Cosmic Background Animation */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .animate-bg {
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Loader */
        .loader {
            border: 4px solid rgba(59, 130, 246, 0.1);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Accordion transition */
        .accordion-content {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 5000px;
            opacity: 1;
        }
        .rotate-180 { transform: rotate(180deg); }

        .star-dot { background-color: #94a3b8; }
        .dark .star-dot { background-color: #ffffff; }

        /* Modal Styles */
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        dialog {
            background: transparent;
            border: none;
            padding: 0;
            margin: auto;
        }
        .disabled-entity {
            opacity: 0.6;
            filter: grayscale(1);
        }
        
        /* Utility for platform grid labels */
        .stat-label {
            font-size: 0.6rem;
            line-height: 1;
            text-transform: uppercase;
            font-weight: 700;
            color: #64748b; /* slate-500 */
        }
        .dark .stat-label { color: #94a3b8; /* slate-400 */ }
    </style>

    <script type="module">
        import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
        import { getDatabase, ref, onValue, update, set, remove } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js';

        // Set default to SUPER to allow full access without code
        let userRole = 'SUPER'; 

        // --- THEME LOGIC ---
        const htmlEl = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');
        const iconSun = document.getElementById('icon-sun');
        const iconMoon = document.getElementById('icon-moon');

        function updateThemeIcons() {
            if (htmlEl.classList.contains('dark')) {
                iconSun.classList.remove('hidden');
                iconMoon.classList.add('hidden');
            } else {
                iconSun.classList.add('hidden');
                iconMoon.classList.remove('hidden');
            }
        }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlEl.classList.add('dark');
        } else {
            htmlEl.classList.remove('dark');
        }
        updateThemeIcons();
        themeBtn.addEventListener('click', () => {
            htmlEl.classList.toggle('dark');
            localStorage.theme = htmlEl.classList.contains('dark') ? 'dark' : 'light';
            updateThemeIcons();
        });

        // --- AUTH & MASTER DB CONSTANTS ---
        const MASTER_FIREBASE_CONFIG = {
            apiKey: "AIzaSyDJ0W3pjxunTgK1jy8YNHgSYEsncgQa7zE", 
            authDomain: "dashboard-emsw.firebaseapp.com", 
            databaseURL: "https://dashboard-emsw-default-rtdb.firebaseio.com/", 
            projectId: "dashboard-emsw",
            storageBucket: "dashboard-emsw.firebasestorage.app",
            messagingSenderId: "295410292951",
            appId: "1:295410292951:web:f1015c207e9ad9f6a5f892",
            measurementId: "G-ZD9NDGES3E"
        };

        // --- CONFIGURATION ---
        const BUILTIN_CONFIGS = {
          EMS1: {
            apiKey: "AIzaSyCEwB2iTsirdhL6O3xymPGAt2k5yia6tjw",
            authDomain: "ems1-reporting.firebaseapp.com",
            databaseURL: "https://ems1-reporting-default-rtdb.firebaseio.com",
            projectId: "ems1-reporting",
            appId: "1:649094135962:web:eaa6641f80c2805e8f5f23"
          },
          EMS3: {
            apiKey: "AIzaSyBp5t2-Xlxj6_XiDi6y09zbOkHYLe2X9Ls",
            authDomain: "ems3-reporting.firebaseapp.com",
            databaseURL: "https://ems3-reporting-default-rtdb.firebaseio.com",
            projectId: "ems3-reporting",
            appId: "1:696098202646:web:8abbc6257a2982549c0137"
          },
          EMS4: {
            apiKey: "AIzaSyAFR96bibEGLaMroqFZCLcSHyCoAdewz78",
            authDomain: "ems4-reporting.firebaseapp.com",
            databaseURL: "https://ems4-reporting-default-rtdb.firebaseio.com",
            projectId: "ems4-reporting",
            appId: "1:290747078412:web:f1ddc2273dc07cc6e55b29"
          },
          EMS6: {
            apiKey: "AIzaSyB_aylTk3hW60y3Kewlbb4B76J3f-lx0qE",
            authDomain: "ems6-reporting.firebaseapp.com",
            databaseURL: "https://ems6-reporting-default-rtdb.firebaseio.com",
            projectId: "ems6-reporting",
            appId: "1:1091962206156:web:0c6c970e222403ab1f8f69"
          },
          DMF: {
            apiKey: "AIzaSyBaPXh-EtZqg-cgD_RNyEx_PNisfngT8-s",
            authDomain: "dmf-reporting.firebaseapp.com",
            databaseURL: "https://dmf-reporting-default-rtdb.firebaseio.com/",
            projectId: "dmf-reporting",
            appId: "1:151591156744:web:ec1a8c2a68b629c46ca5bd"
          }
        };

        // Whitelist Configuration for Active Platforms
        const ALLOWED_PLATFORMS = {
            'DMF': ['SELENIUM 2'],
            'EMS1': ['SELENIUM'],
            'EMS3': ['WEB', 'SELENIUM', 'AUTOMAT'],
            'EMS4': ['WEB', 'SELENIUM'],
            'EMS6': ['WEB', 'SELENIUM', 'AUTOMAT']
        };

        // Current active configs (starts with built-in, adds custom ones from Master DB)
        let ALL_ENTITY_CONFIGS = { ...BUILTIN_CONFIGS };

        // --- FIREBASE INITIALIZATION ---
        // 1. Initialize Master App for Custom Entities storage
        const masterApp = initializeApp(MASTER_FIREBASE_CONFIG, "MASTER_APP");
        const masterDb = getDatabase(masterApp);

        const initializedApps = {};

        function getEntityApp(entityId) {
            if (initializedApps[entityId]) return initializedApps[entityId];
            const existingApps = getApps();
            const found = existingApps.find(app => app.name === entityId);
            initializedApps[entityId] = found ? found : initializeApp(ALL_ENTITY_CONFIGS[entityId], entityId);
            return initializedApps[entityId];
        }

        // --- STATE MANAGEMENT ---
        // Global store for entity data
        const appState = {}; 
        Object.keys(BUILTIN_CONFIGS).forEach(id => {
            appState[id] = { globalStats: {}, platforms: {}, rawData: null, disabled: false };
        });
        
        const expandedEntities = new Set();
        const connectedEntityIds = new Set();
        // Store disabled state for built-ins locally
        const localDisabledStore = JSON.parse(localStorage.getItem('disabledEntities') || '{}');

        // --- DATA EXTRACTION HELPER ---
        function findMetric(obj, keys, type = 'int') {
            if (!obj) return type === 'string' ? '-' : 0;
            const objKeys = Object.keys(obj);
            const objKeysLower = objKeys.map(k => k.toLowerCase().trim());
            
            for (const key of keys) {
                const searchKey = key.toLowerCase().trim();
                const idx = objKeysLower.indexOf(searchKey);
                if (idx !== -1) {
                    const val = obj[objKeys[idx]];
                    if (val !== undefined && val !== null && val !== '') {
                        if (type === 'int') {
                            const p = parseInt(val, 10);
                            return isNaN(p) ? 0 : p;
                        }
                        return val;
                    }
                }
            }
            return type === 'string' ? '-' : 0;
        }

        // --- LOGIC UPDATE: processPlanData ---
        function processPlanData(rawPlans, rootPath, entityId) {
             const platforms = {};
             const allowed = ALLOWED_PLATFORMS[entityId];

             Object.keys(rawPlans).forEach(key => {
                // If this entity has a whitelist, strictly enforce it
                if (allowed && !allowed.includes(key)) return;

                const planData = rawPlans[key] || {};
                const currentData = planData.current || {};
                
                // ROBUSTNESS: Updated searchObj to include planData (root)
                const searchObj = { 
                    ...planData,
                    ...(planData.stats || {}), 
                    ...currentData, 
                    ...(currentData.stats || {}) 
                };

                // Ensure we only process if there is relevant data
                if (Object.keys(searchObj).length > 0 || planData.deploys || currentData.deploys) {
                    
                    // 1. Calculate Deploys/h (active deploys)
                    let activeDeploysCount = 0;
                    
                    // Prioritize counting active entries in 'deploys' object (Check both root and current)
                    let deploysObj = planData.deploys || currentData.deploys;
                    
                    if (deploysObj && typeof deploysObj === 'object') {
                        // If it's an array, filter out nulls/undefined to be safe
                        if (Array.isArray(deploysObj)) {
                            activeDeploysCount = deploysObj.filter(d => d).length;
                        } else {
                            activeDeploysCount = Object.keys(deploysObj).length;
                        }
                    } 
                    
                    // Fallback to existing metric search if object count is 0
                    if (activeDeploysCount === 0) {
                        activeDeploysCount = findMetric(searchObj, [
                            'nbrdeploysperhour', 'active_deploys', 'activeDeploys', 'Deploys/h', 'deploys_per_hour',
                            'nbrdeploys', 'nbr_deploys', 'total_deploys', 'deploys'
                        ]);
                    }

                    // 2. Get Launches
                    const lancements = findMetric(searchObj, ['nbrlancement', 'Lancements', 'Launches', 'launches', 'lancement']);
                    
                    // 3. Calculate Deploys/Day = Deploys/h * Launches
                    const calculatedDeploysDay = activeDeploysCount * lancements;

                    // Extract all requested metrics
                    const stats = {
                            seeds: findMetric(searchObj, ['Seeds', 'seeds', 'SEEDS', 'nbrseeds']),
                            rdps: findMetric(searchObj, ['RDPs', 'rdps', 'RDP', 'nbrrdp']),
                            sessions: findMetric(searchObj, ['Sessions', 'sessions', 'nbrsession']),
                            deploysHr: activeDeploysCount,
                            deploysDay: calculatedDeploysDay,
                            seedsHr: findMetric(searchObj, ['nbrseedsperhour', 'Seeds/h', 'Seeds/Hour', 'seedsHr']),
                            seedsDay: findMetric(searchObj, ['nbrseedsperday', 'Seeds/d', 'Seeds/Day', 'seedsDay']),
                            lancements: lancements,
                            quality: findMetric(searchObj, ['Quality', 'quality', 'Qual']),
                            paused: findMetric(searchObj, ['Paused', 'paused', 'Pause']),
                            period: findMetric(searchObj, ['period', 'Period', 'date_range'], 'string'),
                            rotation: findMetric(searchObj, ['Rotation', 'rotation'], 'string')
                    };
                    
                    platforms[key] = {
                        stats: stats,
                        updatedAt: currentData.updatedAt || planData.updatedAt || '',
                        path: `${rootPath}/plans/${key}`
                    };
                }
            });
            return platforms;
        }

        // --- ENTITY LISTENER LOGIC ---
        function connectEntity(entityId) {
            if (connectedEntityIds.has(entityId)) return;
            
            // Check disabled state
            const config = ALL_ENTITY_CONFIGS[entityId];
            const isDisabled = config.disabled || localDisabledStore[entityId];
            
            if (!appState[entityId]) {
                appState[entityId] = { globalStats: {}, platforms: {}, rawData: null, disabled: isDisabled };
            } else {
                appState[entityId].disabled = isDisabled;
            }

            try {
                // Handle MANUAL entities (stored in Master DB)
                if (config && config.manual) {
                    const manualRoot = `manual_data/${entityId}`;
                    const manualPlansRef = ref(masterDb, `${manualRoot}/plans`);
                    const manualGlobalRef = ref(masterDb, `${manualRoot}/global_stats`);

                    onValue(manualPlansRef, (snapshot) => {
                         const rawPlans = snapshot.val() || {};
                         const platforms = processPlanData(rawPlans, `${entityId}/plans`, entityId);
                         appState[entityId].platforms = platforms;
                         requestRender();
                    });
                    
                    // Fetch Manual Global Stats
                    onValue(manualGlobalRef, (snapshot) => {
                         const val = snapshot.val() || {};
                         appState[entityId].globalStats = {
                             rdps: findMetric(val, ['glb_rdps', 'Total RDPs', 'RDPs'], 'int'),
                             seeds: findMetric(val, ['Total Seeds', 'Seeds', 'SEEDS'], 'int'),
                             quality: findMetric(val, ['Qualite', 'Quality'], 'int'),
                             paused: findMetric(val, ['Paused'], 'int'),
                             proxy: findMetric(val, ['proxy', 'Proxy'], 'int')
                         };
                         requestRender();
                    });

                    connectedEntityIds.add(entityId);
                    return;
                }

                // Handle CONNECTED entities (Remote Firebase)
                const app = getEntityApp(entityId);
                const db = getDatabase(app);
                const rootPath = entityId.toLowerCase();
                
                const plansRef = ref(db, `${rootPath}/plans`);
                const globalRef = ref(db, `${rootPath}/global_stats`);

                onValue(plansRef, (snapshot) => {
                    const rawPlans = snapshot.val() || {};
                    const platforms = processPlanData(rawPlans, rootPath, entityId);
                    appState[entityId].platforms = platforms;
                    requestRender();
                });

                // Listener for Global Stats
                onValue(globalRef, (snapshot) => {
                    const val = snapshot.val() || {};
                    appState[entityId].globalStats = {
                        rdps: findMetric(val, ['glb_rdps', 'Total RDPs', 'RDPs'], 'int'),
                        seeds: findMetric(val, ['Total Seeds', 'Seeds', 'SEEDS'], 'int'),
                        quality: findMetric(val, ['Qualite', 'Quality'], 'int'),
                        paused: findMetric(val, ['Paused'], 'int'),
                        proxy: findMetric(val, ['proxy', 'Proxy', 'PROXY'], 'int')
                    };
                    requestRender();
                });

                connectedEntityIds.add(entityId);
            } catch (e) {
                console.error("Connection error for " + entityId, e);
            }
        }

        // --- MAIN INIT FUNCTION ---
        function setupRealtimeListeners() {
            // 1. Connect Built-ins
            Object.keys(BUILTIN_CONFIGS).forEach(id => connectEntity(id));

            // 2. Listen to Master DB for custom entities
            const customEntitiesRef = ref(masterDb, 'custom_entities');
            onValue(customEntitiesRef, (snapshot) => {
                const customData = snapshot.val() || {};
                
                const currentCustomIds = Object.keys(ALL_ENTITY_CONFIGS).filter(id => !BUILTIN_CONFIGS[id]);
                const newCustomIds = Object.keys(customData);

                // Remove deleted
                currentCustomIds.forEach(id => {
                    if (!customData[id]) {
                        delete ALL_ENTITY_CONFIGS[id];
                        delete appState[id];
                        connectedEntityIds.delete(id);
                    }
                });

                // Add/Update new
                newCustomIds.forEach(id => {
                    ALL_ENTITY_CONFIGS[id] = customData[id];
                    connectEntity(id); 
                });

                requestRender();
            });
        }

        // --- DEBOUNCED RENDER ---
        let renderTimeout;
        function requestRender() {
            if (renderTimeout) cancelAnimationFrame(renderTimeout);
            renderTimeout = requestAnimationFrame(renderUI);
        }

        // --- UI RENDERING HELPERS ---

        function renderStatCard(label, value, colorClass) {
             return `
                <div class="glass-card p-4 rounded-2xl flex flex-col items-center justify-center hover:bg-black/5 dark:hover:bg-white/5 transition-colors group">
                    <div class="text-[10px] font-black uppercase tracking-wider mb-1 ${colorClass} opacity-80 group-hover:opacity-100 whitespace-nowrap">
                        ${label}
                    </div>
                    <div class="text-3xl font-black ${colorClass} drop-shadow-md">
                        ${value || 0}
                    </div>
                </div>
            `;
        }

        function renderMiniMetric(label, value, colorClass) {
            return `
            <div class="bg-slate-300/50 dark:bg-slate-900/30 p-2 rounded text-center flex flex-col items-center justify-center">
                <span class="stat-label mb-1">${label}</span>
                <span class="font-mono font-bold text-sm ${colorClass}">${value}</span>
            </div>
            `;
        }

        function renderUI() {
            // 1. Calculate Global Totals
            const globalTotals = { rdps: 0, seeds: 0, qual: 0, pause: 0, proxy: 0, sessions: 0, deploysHr: 0, deploysDay: 0, lancements: 0, seedsHr: 0, seedsDay: 0 };
            
            const activeEntityIds = Object.keys(ALL_ENTITY_CONFIGS);
            let totalQualityCount = 0;
            let totalQualitySum = 0;

            activeEntityIds.forEach(entityId => {
                const e = appState[entityId];
                if (!e || e.disabled) return; // Skip disabled stats
                
                const gStats = e.globalStats || {};
                
                // Create a temporary totals object to allow overrides without mutating state
                let entityTotals = {
                    rdps: gStats.rdps || 0,
                    seeds: gStats.seeds || 0,
                    qual: gStats.quality || 0,
                    pause: gStats.paused || 0,
                    proxy: gStats.proxy || 0
                };

                // MANUAL ENTITY AGGREGATION: Dynamically sum from platforms if manual
                // This fixes the issue where manually added data isn't reflected in global stats
                if (ALL_ENTITY_CONFIGS[entityId] && ALL_ENTITY_CONFIGS[entityId].manual) {
                    const platforms = Object.values(e.platforms);
                    if (platforms.length > 0) {
                        entityTotals.seeds = platforms.reduce((acc, p) => acc + (p.stats.seeds || 0), 0);
                        entityTotals.rdps = platforms.reduce((acc, p) => acc + (p.stats.rdps || 0), 0);
                        entityTotals.qual = platforms.reduce((acc, p) => acc + (p.stats.quality || 0), 0);
                        entityTotals.pause = platforms.reduce((acc, p) => acc + (p.stats.paused || 0), 0);
                        // Proxy remains from global stats
                    }
                }

                // OVERRIDE: EMS1 Correct Total Seeds to 12690
                if (entityId === 'EMS1') {
                    entityTotals.seeds = 12690;
                }

                // OVERRIDE: DMF Correct Total Seeds to 16867
                if (entityId === 'DMF') {
                    entityTotals.seeds = 16867;
                }

                // OVERRIDE: EMS3, EMS4, EMS6 Quality & Paused from Platforms if Global is 0
                if (['EMS3', 'EMS4', 'EMS6'].includes(entityId)) {
                     let maxQual = 0;
                     let maxPause = 0;
                     Object.values(e.platforms).forEach(p => {
                         if (p.stats.quality > maxQual) maxQual = p.stats.quality;
                         if (p.stats.paused > maxPause) maxPause = p.stats.paused;
                     });
                     if (maxQual > 0) entityTotals.qual = maxQual;
                     if (maxPause > 0) entityTotals.pause = maxPause;
                }

                // Use Calculated Entity Totals for Global Aggregation
                globalTotals.rdps += entityTotals.rdps;
                globalTotals.seeds += entityTotals.seeds;
                globalTotals.pause += entityTotals.pause;
                globalTotals.proxy += entityTotals.proxy;
                
                if (entityTotals.qual > 0) {
                     totalQualitySum += entityTotals.qual;
                     totalQualityCount++;
                }

                // Use Platform aggregation for others
                Object.values(e.platforms).forEach(p => {
                    globalTotals.sessions += p.stats.sessions;
                    globalTotals.deploysHr += p.stats.deploysHr;
                    globalTotals.deploysDay += p.stats.deploysDay;
                    globalTotals.lancements += p.stats.lancements;
                    globalTotals.seedsHr += p.stats.seedsHr;
                    globalTotals.seedsDay += p.stats.seedsDay;
                });
            });

            globalTotals.qual = totalQualitySum;

            // 2. Render Global Stats Grid
            document.getElementById('global-stats-grid').innerHTML = `
                ${renderStatCard('Total RDPs', globalTotals.rdps, 'text-blue-500 dark:text-blue-400')}
                ${renderStatCard('Total Seeds', globalTotals.seeds, 'text-emerald-600 dark:text-emerald-400')}
                ${renderStatCard('Total Sessions', globalTotals.sessions, 'text-slate-700 dark:text-white')}
                
                ${renderStatCard('Deploys/hour', globalTotals.deploysHr, 'text-indigo-500 dark:text-indigo-400')}
                ${renderStatCard('Deploys/day', globalTotals.deploysDay, 'text-indigo-500 dark:text-indigo-400')}
                ${renderStatCard('Launches', globalTotals.lancements, 'text-orange-500 dark:text-orange-400')}
                
                ${renderStatCard('Seeds/hour', globalTotals.seedsHr, 'text-teal-600 dark:text-teal-400')}
                ${renderStatCard('Seeds/day', globalTotals.seedsDay, 'text-teal-600 dark:text-teal-400')}
                
                ${renderStatCard('Total Quality', globalTotals.qual, 'text-purple-500 dark:text-purple-400')}
                ${renderStatCard('Paused', globalTotals.pause, 'text-rose-500 dark:text-rose-400')}
                ${renderStatCard('Proxy', globalTotals.proxy, 'text-amber-500 dark:text-amber-400')}
            `;

            // 3. Render Entities List
            const listHtml = activeEntityIds.map(entityId => {
                const entityData = appState[entityId];
                if (!entityData) return ''; 

                const isDisabled = entityData.disabled;
                const isManual = ALL_ENTITY_CONFIGS[entityId].manual;
                
                // If disabled, just show header with opacity
                const opacityClass = isDisabled ? 'disabled-entity' : '';
                const isExpanded = expandedEntities.has(entityId);
                const allPlatforms = Object.entries(entityData.platforms);
                
                // VISIBILITY LOGIC: Only display platforms where Launches > 0
                // Note: Global totals above still use all platforms (Object.values(e.platforms))
                const activePlatforms = allPlatforms.filter(([_, data]) => data.stats.lancements > 0);
                
                const gStats = entityData.globalStats || {};
                
                // RE-APPLY OVERRIDES FOR ENTITY CARD DISPLAY
                let entityTotals = {
                    rdps: gStats.rdps || 0,
                    seeds: gStats.seeds || 0,
                    qual: gStats.quality || 0,
                    pause: gStats.paused || 0,
                    proxy: gStats.proxy || 0
                };

                // MANUAL ENTITY AGGREGATION (Display)
                if (ALL_ENTITY_CONFIGS[entityId] && ALL_ENTITY_CONFIGS[entityId].manual) {
                    const platforms = Object.values(entityData.platforms);
                    if (platforms.length > 0) {
                        entityTotals.seeds = platforms.reduce((acc, p) => acc + (p.stats.seeds || 0), 0);
                        entityTotals.rdps = platforms.reduce((acc, p) => acc + (p.stats.rdps || 0), 0);
                        entityTotals.qual = platforms.reduce((acc, p) => acc + (p.stats.quality || 0), 0);
                        entityTotals.pause = platforms.reduce((acc, p) => acc + (p.stats.paused || 0), 0);
                    }
                }
                 
                if (entityId === 'EMS1') entityTotals.seeds = 12690;
                if (entityId === 'DMF') entityTotals.seeds = 16867;

                // OVERRIDE: EMS3, EMS4, EMS6 Quality & Paused from Platforms if Global is 0
                if (['EMS3', 'EMS4', 'EMS6'].includes(entityId)) {
                     let maxQual = 0;
                     let maxPause = 0;
                     Object.values(entityData.platforms).forEach(p => {
                         if (p.stats.quality > maxQual) maxQual = p.stats.quality;
                         if (p.stats.paused > maxPause) maxPause = p.stats.paused;
                     });
                     if (maxQual > 0) entityTotals.qual = maxQual;
                     if (maxPause > 0) entityTotals.pause = maxPause;
                }

                     platformsHTML = `<div class="col-span-full text-center py-4 text-slate-500 text-xs italic">No active data available (Launches = 0).</div>`;

                                <i class="ph ph-pencil-simple"></i>

                        // Detailed Platform Card Layout
                        platformsHTML += `
                        <div class="relative bg-slate-200/50 dark:bg-slate-800/40 rounded-xl p-4 border border-black/5 dark:border-white/5 hover:border-black/10 dark:hover:border-white/10 transition-colors flex flex-col h-full group">

                            <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-2 mt-auto">

                                ${renderMiniMetric('Launches', s.lancements, 'text-orange-500 dark:text-orange-400')}
                                
                                ${renderMiniMetric('Deploys/h', s.deploysHr, 'text-indigo-600 dark:text-indigo-400')}
                                ${renderMiniMetric('Deploys/d', s.deploysDay, 'text-indigo-600 dark:text-indigo-400')}
                                ${renderMiniMetric('Quality', s.quality, 'text-purple-600 dark:text-purple-400')}
                                
                                <div class="col-span-1 lg:col-span-3">

                                </div>
                            </div>

                    });
                }

                            <div class="text-center"><span class="block text-[9px] font-bold text-emerald-500 uppercase">Seeds</span><span class="text-lg font-black text-slate-700 dark:text-white">${entityTotals.seeds}</span></div>
                            <div class="text-center"><span class="block text-[9px] font-bold text-purple-500 uppercase">Quality</span><span class="text-lg font-black text-slate-700 dark:text-white">${entityTotals.qual}</span></div>
                            <div class="text-center"><span class="block text-[9px] font-bold text-rose-500 uppercase">Paused</span><span class="text-lg font-black text-slate-700 dark:text-white">${entityTotals.pause}</span></div>
                            <div class="text-center"><span class="block text-[9px] font-bold text-orange-500 uppercase">Proxy</span>${proxyDisplay}</div>
                        </div>

                        <div class="transform transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}">
                            <i class="ph ph-caret-down text-xl text-slate-400"></i>
                        </div>
                    </div>

                    <div class="accordion-content ${isExpanded ? 'open' : ''}">
                        <div class="p-6 bg-slate-50/50 dark:bg-slate-950/30 border-t border-black/5 dark:border-white/5">
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                                ${platformsHTML}
                                ${addBtn}
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('entities-list').innerHTML = listHtml;
            
            // Show/Hide Super Admin Controls
            if (userRole === 'SUPER') {
                document.getElementById('super-admin-controls').classList.remove('hidden');
            } else {
                document.getElementById('super-admin-controls').classList.add('hidden');
            }
        }

        // --- HTML INTERACTION HANDLERS ---
        window.toggleEntity = (id) => {
            if (expandedEntities.has(id)) expandedEntities.delete(id);
            else expandedEntities.add(id);
            renderUI();
        };

        window.toggleEntityFields = () => {
             const type = document.querySelector('input[name="entityType"]:checked').value;
             const container = document.getElementById('api-config-container');
             if (type === 'api') container.classList.remove('hidden');
             else container.classList.add('hidden');
        };

        // --- EDITOR LOGIC (SUPER ADMIN) ---
        function setModalView(mode) {
             const editFields = document.getElementById('edit-data-fields');
             const newPlatFields = document.getElementById('new-platform-fields');
             const newEntityFields = document.getElementById('new-entity-fields');
             const globalFields = document.getElementById('edit-global-fields');
             document.getElementById('edit-mode').value = mode;

             // Hide all first
             editFields.classList.add('hidden');
             newPlatFields.classList.add('hidden');
             newEntityFields.classList.add('hidden');
             globalFields.classList.add('hidden');

             if (mode === 'data') {
                 editFields.classList.remove('hidden');
             } else if (mode === 'platform') {
                 editFields.classList.remove('hidden'); 
                 newPlatFields.classList.remove('hidden');
             } else if (mode === 'entity') {
                 newEntityFields.classList.remove('hidden');
                 document.querySelector('input[name="entityType"][value="api"]').checked = true;
                 window.toggleEntityFields();
             } else if (mode === 'global') {
                 globalFields.classList.remove('hidden');
             }
        }

        window.openEditModal = (entityId, platformKey) => {
            const data = appState[entityId].platforms[platformKey];
            const stats = data.stats;
            
            document.getElementById('modal-title').innerText = `Edit: ${platformKey}`;
            document.getElementById('edit-entity-id').value = entityId;
            document.getElementById('edit-platform-id').value = platformKey;
            
            // Populate
            document.getElementById('edit-seeds').value = stats.seeds || 0;
            document.getElementById('edit-rdps').value = stats.rdps || 0;
            document.getElementById('edit-sessions').value = stats.sessions || 0;
            document.getElementById('edit-quality').value = stats.quality || 0;
            document.getElementById('edit-deploysHr').value = stats.deploysHr || 0;
            document.getElementById('edit-paused').value = stats.paused || 0;
            document.getElementById('edit-deploysDay').value = stats.deploysDay || 0;
            document.getElementById('edit-seedsHr').value = stats.seedsHr || 0;
            document.getElementById('edit-seedsDay').value = stats.seedsDay || 0;
            document.getElementById('edit-lancements').value = stats.lancements || 0;
            document.getElementById('edit-period').value = stats.period || '';
            document.getElementById('edit-rotation').value = stats.rotation || '';

            setModalView('data');
            document.getElementById('editor-modal').showModal();
        };

        window.openGlobalStatsModal = (entityId) => {
            document.getElementById('modal-title').innerText = `Edit Global Stats: ${entityId}`;
            document.getElementById('edit-entity-id').value = entityId;
            document.getElementById('edit-platform-id').value = 'GLOBAL';
            
            const gStats = appState[entityId].globalStats || {};
            document.getElementById('edit-global-proxy').value = gStats.proxy || 0;
            document.getElementById('edit-global-rdps').value = gStats.rdps || 0;
            document.getElementById('edit-global-seeds').value = gStats.seeds || 0;
            document.getElementById('edit-global-quality').value = gStats.quality || 0;
            document.getElementById('edit-global-paused').value = gStats.paused || 0;
            
            setModalView('global');
            document.getElementById('editor-modal').showModal();
        };

        window.openAddPlatformModal = (entityId) => {
            document.getElementById('modal-title').innerText = `Add Platform to ${entityId}`;
            document.getElementById('editor-form').reset();
            document.getElementById('edit-entity-id').value = entityId;
            document.getElementById('edit-platform-id').value = 'NEW';
            
            setModalView('platform');
            document.getElementById('editor-modal').showModal();
        };

        window.openNewEntityModal = () => {
            document.getElementById('modal-title').innerText = `Add New Entity`;
            document.getElementById('editor-form').reset();
            setModalView('entity');
            document.getElementById('editor-modal').showModal();
        };

        window.toggleEntityState = async (entityId) => {
            const currentState = appState[entityId].disabled;
            const newState = !currentState;
            
            // If custom entity, save to Master DB
            if (ALL_ENTITY_CONFIGS[entityId] && !BUILTIN_CONFIGS[entityId]) {
                try {
                    await update(ref(masterDb, 'custom_entities/' + entityId), { disabled: newState });
                } catch(e) {
                    alert("Error updating state: " + e.message);
                }
            } else {
                // For built-ins, save to local storage
                localDisabledStore[entityId] = newState;
                localStorage.setItem('disabledEntities', JSON.stringify(localDisabledStore));
                // Force update state
                appState[entityId].disabled = newState;
                requestRender();
            }
        };

        window.deleteEntity = async (entityId) => {
            if (confirm(`Are you sure you want to delete ${entityId} and remove it for everyone?`)) {
                 try {
                     // Delete from config list
                     await remove(ref(masterDb, 'custom_entities/' + entityId));
                     // Also try to delete manual data if it exists
                     await remove(ref(masterDb, 'manual_data/' + entityId));
                 } catch(e) {
                     alert("Error deleting entity: " + e.message);
                 }
            }
        };

        document.getElementById('editor-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mode = document.getElementById('edit-mode').value;
            
            if (mode === 'entity') {
                // HANDLE NEW ENTITY CREATION -> Save to Master DB
                const id = document.getElementById('new-entity-id-input').value.toUpperCase().replace(/\s+/g, '');
                if (!id) return alert("Entity Name Required");
                
                const type = document.querySelector('input[name="entityType"]:checked').value;
                let config = {};

                if (type === 'api') {
                    config = {
                        apiKey: document.getElementById('new-entity-apikey').value.trim(),
                        authDomain: document.getElementById('new-entity-authdomain').value.trim(),
                        databaseURL: document.getElementById('new-entity-dburl').value.trim(),
                        projectId: document.getElementById('new-entity-projectid').value.trim(),
                        appId: document.getElementById('new-entity-appid').value.trim()
                    };
                    if (!config.apiKey || !config.databaseURL) return alert("API Key and DB URL are required.");
                } else {
                    config = { manual: true };
                }

                try {
                    await update(ref(masterDb, 'custom_entities/' + id), config);
                    document.getElementById('editor-modal').close();
                } catch(err) {
                    alert("Failed to save entity to master DB: " + err.message);
                }
                return;
            }

            const entityId = document.getElementById('edit-entity-id').value;
            const entityConfig = ALL_ENTITY_CONFIGS[entityId];

            if (mode === 'global') {
                // Update Global Stats (Manual Only currently supported by UI, but logic fits)
                if (entityConfig && entityConfig.manual) {
                    await update(ref(masterDb, `manual_data/${entityId}/global_stats`), { 
                        proxy: parseInt(document.getElementById('edit-global-proxy').value) || 0,
                        glb_rdps: parseInt(document.getElementById('edit-global-rdps').value) || 0,
                        "Total Seeds": parseInt(document.getElementById('edit-global-seeds').value) || 0,
                        Qualite: parseInt(document.getElementById('edit-global-quality').value) || 0,
                        Paused: parseInt(document.getElementById('edit-global-paused').value) || 0,
                    });
                    document.getElementById('editor-modal').close();
                } else {
                    alert("Editing global stats for connected entities is not supported in this view.");
                }
                return;
            }

            // HANDLE PLATFORM EDIT / ADD
            let platformId = document.getElementById('edit-platform-id').value;
            
            if (platformId === 'NEW') {
                platformId = document.getElementById('edit-name').value.toUpperCase().replace(/\s+/g, '_');
                if (!platformId) return alert("Name required");
            }

            // Construct Update Object
            const updates = {
                current: {
                    updatedAt: new Date().toISOString().replace('T', ' ').substring(0, 19),
                    seeds: parseInt(document.getElementById('edit-seeds').value) || 0,
                    rdps: parseInt(document.getElementById('edit-rdps').value) || 0,
                    sessions: parseInt(document.getElementById('edit-sessions').value) || 0,
                    quality: parseInt(document.getElementById('edit-quality').value) || 0,
                    nbrdeploysperhour: parseInt(document.getElementById('edit-deploysHr').value) || 0,
                    paused: parseInt(document.getElementById('edit-paused').value) || 0,
                    nbrdeploysperday: parseInt(document.getElementById('edit-deploysDay').value) || 0,
                    nbrseedsperhour: parseInt(document.getElementById('edit-seedsHr').value) || 0,
                    nbrseedsperday: parseInt(document.getElementById('edit-seedsDay').value) || 0,
                    nbrlancement: parseInt(document.getElementById('edit-lancements').value) || 0,
                    period: document.getElementById('edit-period').value,
                    rotation: document.getElementById('edit-rotation').value,
                }
            };

            try {
                if (entityConfig && entityConfig.manual) {
                    // Save to Master DB Manual Data path
                    const path = `manual_data/${entityId}/plans/${platformId}`;
                    await update(ref(masterDb, path), updates);
                } else {
                    // Save to Remote DB
                    const app = getEntityApp(entityId);
                    const db = getDatabase(app);
                    const path = `${entityId.toLowerCase()}/plans/${platformId}`;
                    await update(ref(db, path), updates);
                }
                
                document.getElementById('editor-modal').close();
            } catch (err) {
                alert("Save failed: " + err.message);
            }
        });

        // --- STARS ANIMATION ---
        function generateStars() {
            const container = document.getElementById('stars-container');
            let html = '';
            for (let i = 0; i < 40; i++) {
                const top = Math.random() * 100;
                const left = Math.random() * 100;
                const size = Math.random() * 2 + 1;
                html += `<div class="absolute rounded-full star-dot opacity-40" style="top: ${top}%; left: ${left}%; width: ${size}px; height: ${size}px;"></div>`;
            }
            container.innerHTML = html;
        }
        generateStars();

        // Immediately start listeners without password check
        setupRealtimeListeners();

    </script>
  </body>
</html>
